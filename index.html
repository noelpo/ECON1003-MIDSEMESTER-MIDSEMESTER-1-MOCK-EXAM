const questions=[{"scenario": "For every real x, define f(x) = 2x + |x − 3|.", "prompt": "What is f(−2)?", "options": ["−9", "−1", "1", "9"], "answer": 2, "explanation": "Substitute x = −2: f(−2) = −4 + |−5| = −4 + 5 = 1. The absolute value is nonnegative.", "visual": ""}, {"scenario": "The function f is defined by f(x) = √(x + 6) for x ≥ 3, and f(x) = x² − 2x + 4 for x < 3. Square roots denote principal nonnegative roots.", "prompt": "What is f(3) + f(−1)?", "options": ["10", "12", "6", "16"], "answer": 0, "explanation": "At x = 3 use the first branch: f(3) = √9 = 3. At x = −1 use the second: 1 + 2 + 4 = 7. Their sum is 10.", "visual": ""}, {"scenario": "The function f is defined by f(x) = √(x + 6) for x ≥ 3, and f(x) = x² − 2x + 4 for x < 3. Square roots denote principal nonnegative roots.", "prompt": "What is f(√7)?", "options": ["√(√7 + 6)", "11 + 2√7", "√13", "11 − 2√7"], "answer": 3, "explanation": "Since √7 < 3, use x² − 2x + 4. The result is 7 − 2√7 + 4 = 11 − 2√7.", "visual": ""}, {"scenario": "Let f(x) = x² − 3x + 2 and g(x) = 2x − 1.", "prompt": "Which expression equals the composition f(g(x))?", "options": ["4x² − 6x + 2", "4x² − 10x + 6", "2x² − 6x + 3", "2x³ − 7x² + 7x − 2"], "answer": 1, "explanation": "Substitute 2x − 1 into every occurrence of x in f: (2x − 1)² − 3(2x − 1) + 2 = 4x² − 10x + 6. This is composition, not multiplication.", "visual": ""}, {"scenario": "Let f(x) = x² − 3x + 2 and g(x) = 2x − 1.", "prompt": "Which expression equals the product f(x)g(x)?", "options": ["2x³ − 5x² + x + 2", "2x³ − 7x² + 7x − 2", "2x³ − 6x² + 4x", "4x² − 10x + 6"], "answer": 1, "explanation": "Multiply (x² − 3x + 2)(2x − 1). Collect terms: 2x³ − x² − 6x² + 3x + 4x − 2 = 2x³ − 7x² + 7x − 2.", "visual": ""}, {"scenario": "Define f(x) = 3x² − 2x + 1. Let h be nonzero.", "prompt": "What is [f(2 + h) − f(2)]/h after simplification?", "options": ["10h", "3h + 14", "3h² + 10", "3h + 10"], "answer": 3, "explanation": "f(2 + h) = 9 + 10h + 3h² and f(2) = 9. Their difference is 10h + 3h². Divide by nonzero h to obtain 10 + 3h.", "visual": ""}, {"scenario": "Consider the real valued function g(x) = √(5 − 2x)/(x − 1).", "prompt": "What is its domain?", "options": ["x < 1 or x > 5/2", "x ≤ 5/2 and x ≠ 1", "x ≥ 5/2 and x ≠ 1", "x ≤ 5/2"], "answer": 1, "explanation": "The radicand must be nonnegative: 5 − 2x ≥ 0 gives x ≤ 5/2. The denominator cannot be zero, so exclude x = 1. The point 5/2 is allowed.", "visual": ""}, {"scenario": "Consider the real valued function h(x) = √(x + 2)/√(4 − x).", "prompt": "What is its domain?", "options": ["−2 ≤ x ≤ 4", "x < 4", "−2 ≤ x < 4", "−2 < x < 4"], "answer": 2, "explanation": "The numerator permits x + 2 ≥ 0, or x ≥ −2. The denominator must be defined and nonzero, so 4 − x > 0, or x < 4. Combine them to obtain [−2,4).", "visual": ""}, {"scenario": "Solve the equation (x² − 9)/(x − 3) = 0 over the real numbers.", "prompt": "What is the solution set?", "options": ["{−3}", "{3}", "There is no solution", "{−3, 3}"], "answer": 0, "explanation": "The numerator factors as (x − 3)(x + 3), but x = 3 makes the original denominator zero. Only x = −3 gives a zero numerator with a nonzero denominator.", "visual": ""}, {"scenario": "A student solves 5p − (3p − 2)/2 = 2(1 − p) − (p + 4)/3.", "prompt": "What is p?", "options": ["2/35", "−1/3", "−2/35", "−2/7"], "answer": 2, "explanation": "Multiply by 6: 30p − 3(3p − 2) = 12(1 − p) − 2(p + 4). This gives 21p + 6 = 4 − 14p, hence 35p = −2 and p = −2/35.", "visual": ""}, {"scenario": "Let x = −4. Evaluate √(x²) − x²/4. The square root is the principal root.", "prompt": "What is the value?", "options": ["−4", "8", "−8", "0"], "answer": 3, "explanation": "√(x²) = |x| = 4, while x²/4 = 16/4 = 4. The difference is zero. In general √(x²) equals |x|, not necessarily x.", "visual": ""}, {"scenario": "A student claims that whenever real numbers a and b satisfy ab = 1, at least one of a or b must equal 1.", "prompt": "Which pair disproves the claim?", "options": ["a = 0, b = 1", "a = 2, b = 1/2", "a = 1, b = 1", "a = 2, b = 2"], "answer": 1, "explanation": "The pair 2 and 1/2 has product 1, but neither number equals 1. A single counterexample is enough to disprove the universal claim.", "visual": ""}, {"scenario": "Solve x² + 5x > 14 over the real numbers.", "prompt": "Which solution set is correct?", "options": ["x < −7 or x > 2", "−7 < x < 2", "x < −2 or x > 7", "−2 < x < 7"], "answer": 0, "explanation": "Rearrange to x² + 5x − 14 > 0, or (x + 7)(x − 2) > 0. Both factors have the same sign outside the roots: x < −7 or x > 2. Strict inequality excludes the roots.", "visual": ""}, {"scenario": "Solve 20 ≥ x² + x over the real numbers.", "prompt": "Which solution set is correct?", "options": ["−5 ≤ x ≤ 4", "−4 ≤ x ≤ 5", "−5 < x < 4", "x ≤ −5 or x ≥ 4"], "answer": 0, "explanation": "Rearrange to x² + x − 20 ≤ 0, or (x + 5)(x − 4) ≤ 0. The product is nonpositive between the roots, including both roots.", "visual": ""}, {"scenario": "Solve (x − 2)/(x + 1) ≥ 0 over the real numbers.", "prompt": "Which solution set is correct?", "options": ["x < −1 or x ≥ 2", "−1 ≤ x ≤ 2", "−1 < x < 2", "x ≤ −1 or x ≥ 2"], "answer": 0, "explanation": "Critical values are −1 and 2. The quotient is positive on x < −1 and x > 2. Include 2, where the quotient is zero; exclude −1, where it is undefined.", "visual": ""}, {"scenario": "Solve |(3x − 2)/4| < 2 over the real numbers.", "prompt": "Which solution set is correct?", "options": ["−10/3 < x < 2", "−2 ≤ x ≤ 10/3", "x < −2 or x > 10/3", "−2 < x < 10/3"], "answer": 3, "explanation": "Multiply by 4 and use −8 < 3x − 2 < 8. Add 2: −6 < 3x < 10. Divide by 3 to obtain −2 < x < 10/3.", "visual": ""}, {"scenario": "Solve |2x + 5| ≥ 7 over the real numbers.", "prompt": "Which solution set is correct?", "options": ["x ≤ −6 or x ≥ 1", "x ≤ −1 or x ≥ 6", "−6 ≤ x ≤ 1", "x < −6 or x > 1"], "answer": 0, "explanation": "An absolute value at least 7 gives 2x + 5 ≤ −7 or 2x + 5 ≥ 7. Thus x ≤ −6 or x ≥ 1, including the boundary values.", "visual": ""}, {"scenario": "Solve the two inequalities 2x − 3 < 5 and 7 − 3x ≤ 10 simultaneously.", "prompt": "Which solution set is correct?", "options": ["−1 ≤ x < 4", "x ≤ −1", "−1 < x ≤ 4", "x < 4 or x ≥ −1"], "answer": 0, "explanation": "The first inequality gives x < 4. The second gives −3x ≤ 3; dividing by −3 reverses the inequality, giving x ≥ −1. Their intersection is [−1,4).", "visual": ""}, {"scenario": "The graph below is a restricted parabola. Only the blue curve is part of the graph; it does not continue past the endpoints. An open circle excludes an endpoint, and a filled circle includes it. Exact endpoint and vertex coordinates are labelled.", "prompt": "What is the domain of this graph?", "options": ["−1 ≤ x ≤ 5", "0 ≤ y ≤ 9", "All real x", "−1 < x ≤ 5"], "answer": 3, "explanation": "The horizontal extent starts at x = −1 with an open endpoint and ends at x = 5 with a closed endpoint. The domain is (−1,5]. Cropping alone does not define a domain, but the stated endpoints do.", "visual": "<svg viewBox=\"0 0 620 420\" role=\"img\" aria-label=\"Restricted downward parabola. Open endpoint at negative one, zero; closed endpoint at five, zero; highest point two, nine.\"><rect x=\"55\" y=\"25\" width=\"530\" height=\"335\" fill=\"#fbfdff\" stroke=\"#b8c9e5\"/><path d=\"M55.00 25V360\" stroke=\"#dce5f2\"/><text x=\"55.00\" y=\"382\" text-anchor=\"middle\" font-size=\"13\">-2</text><path d=\"M121.25 25V360\" stroke=\"#dce5f2\"/><path d=\"M187.50 25V360\" stroke=\"#dce5f2\"/><text x=\"187.50\" y=\"382\" text-anchor=\"middle\" font-size=\"13\">0</text><path d=\"M253.75 25V360\" stroke=\"#dce5f2\"/><path d=\"M320.00 25V360\" stroke=\"#dce5f2\"/><text x=\"320.00\" y=\"382\" text-anchor=\"middle\" font-size=\"13\">2</text><path d=\"M386.25 25V360\" stroke=\"#dce5f2\"/><path d=\"M452.50 25V360\" stroke=\"#dce5f2\"/><text x=\"452.50\" y=\"382\" text-anchor=\"middle\" font-size=\"13\">4</text><path d=\"M518.75 25V360\" stroke=\"#dce5f2\"/><path d=\"M5 // Standalone practice exam. All marking happens locally; no scores are sent to a server.
// Increment this key when publishing a different question set.
const KEY='nlts-econ1003-challenge-v1';
const DURATION=60*60*1000;
const app=document.getElementById('app');
const dialog=document.getElementById('confirm');
let state=null, interval=null, storageOK=true;
let celebrationTimeout=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function valid(s){return s&&s.version===1&&typeof s.name==='string'&&Number.isFinite(s.deadline)&&Number.isFinite(s.started)&&Number.isInteger(s.index)&&s.index>=0&&s.index<questions.length&&Array.isArray(s.answers)&&s.answers.length===questions.length&&s.answers.every((a,i)=>a===null||(Number.isInteger(a)&&a>=0&&a<questions[i].options.length))&&(s.done||s.answers.slice(0,s.index).every(a=>a!==null))&&typeof s.done==='boolean';}
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(valid(saved))state=saved;}}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;const n=document.getElementById('storageWarning');if(n)n.classList.remove('hidden');}}
function remaining(){return Math.max(0,Math.ceil((state.deadline-Date.now())/1000));}
function start(){const name=document.getElementById('studentName').value.trim();if(!name){document.getElementById('nameError').textContent='Please enter your name before starting.';document.getElementById('studentName').focus();return;}const t=Date.now();state={version:1,name,started:t,deadline:t+DURATION,index:0,answers:Array(25).fill(null),done:false};save();renderQuestion();runTimer();}
function intro(){app.innerHTML=`<div class="intro"><section><div class="eyebrow">ECON1003 · Practice examination</div><h1>Midsemester 1<br>Mock Exam</h1><p class="muted">Build your confidence with 25 challenging original questions modelled on your ECON1003 sample questions.</p><div class="stats"><div class="stat"><strong>25</strong><span>Multiple choice questions</span></div><div class="stat"><strong>60</strong><span>Minutes to complete</span></div><div class="stat"><strong>1</strong><span>Mark per question</span></div></div><p><strong>No limits to what you can achieve.</strong></p></section><section class="panel"><div class="eyebrow">Before you begin</div><h2>Your exam instructions</h2><ol class="rules"><li>Each page shows one question with its complete scenario.</li><li>Choose one answer, then select <strong>Save & continue</strong>. You cannot return to an earlier question.</li><li>There is no skip button. You must select an answer before continuing.</li><li>The timer begins when you start. It continues if you refresh or leave the page.</li><li>Your exam submits automatically when time expires. Answers and explanations appear only after submission.</li><li>A scientific calculator is permitted. Round only your final answer as requested. Use real numbers throughout. Square roots denote principal roots. Pay attention to excluded denominators, open endpoints and dashed graph boundaries.</li><li>After submission, you may start another attempt with a fresh one hour timer.</li></ol><form id="startForm"><label class="name" for="studentName">Student name</label><input id="studentName" type="text" maxlength="100" autocomplete="name" placeholder="Enter your full name" required><p id="nameError" class="error" role="alert"></p><button class="btn wide" type="submit">Start mock exam <span aria-hidden="true">→</span></button></form><p class="note">Your name and responses stay in this browser. Results are not sent to NLTS. Use your own browser profile on a shared device.</p><p class="error ${storageOK?'hidden':''}">Browser storage is unavailable. Keep this page open to preserve your attempt.</p></section></div>`;document.getElementById('startForm').onsubmit=e=>{e.preventDefault();start();};}
function renderQuestion(){if(state.done){results();return;}if(remaining()===0){finish(true);return;}const q=questions[state.index];app.innerHTML=`<div class="topbar"><div><div class="eyebrow">Midsemester 1 Mock Exam</div><strong>${esc(state.name)}</strong></div><div class="timer" id="timer" role="timer" aria-label="Time remaining"><small>TIME REMAINING</small><strong id="clock">60:00</strong></div></div><div class="progress" role="progressbar" aria-label="Questions completed" aria-valuemin="0" aria-valuemax="25" aria-valuenow="${state.index}"><span style="width:${state.index/25*100}%"></span></div><div class="examgrid"><aside class="side"><div class="panel"><div class="eyebrow">Your progress</div><h2>${state.index+1} <span class="muted">/ 25</span></h2><h3>Forward only</h3><p>Once you continue, this question is locked.</p><h3>One best answer</h3><p>Each correct answer earns one mark. No marks are deducted for an incorrect response.</p><p>Answers become available after you submit.</p></div></aside><section class="panel" aria-labelledby="questionTitle"><span class="tag">Question ${state.index+1}</span><div class="scenario"><div class="eyebrow">Scenario</div><p>${esc(q.scenario)}</p></div>${q.visual}<h2 id="questionTitle" tabindex="-1">${esc(q.prompt)}</h2><fieldset class="options"><legend>Select one answer for question ${state.index+1}</legend>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${state.answers[state.index]===i?'checked':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></label>`).join('')}</fieldset><div class="actions"><button class="btn" id="next" ${state.answers[state.index]===null?'disabled':''}>${state.index===24?'Submit exam':'Save & continue'} <span aria-hidden="true">→</span></button></div><p id="storageWarning" class="error ${storageOK?'hidden':''}" role="alert">Browser storage is unavailable. Keep this page open to preserve your attempt.</p><p class="note">Question ${state.index+1} of 25 · No return to previous questions</p></section></div><p id="timeNotice" class="error" role="status"></p>`;app.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{if(remaining()===0){finish(true);return;}state.answers[state.index]=Number(el.value);save();document.getElementById('next').disabled=false;});document.getElementById('next').onclick=()=>advance();tick();}
function advance(){if(state.done)return;if(remaining()===0){finish(true);return;}if(state.answers[state.index]===null)return;if(state.index===24){document.getElementById('confirmText').textContent=`You have answered ${state.answers.filter(a=>a!==null).length} of 25 questions. Your score and correct answers will appear after submission.`;dialog.showModal();return;}state.index++;save();renderQuestion();window.scrollTo(0,0);document.getElementById('questionTitle')?.focus({preventScroll:true});}
function tick(){if(!state||state.done)return;const secs=remaining();if(secs===0){finish(true);return;}const clock=document.getElementById('clock');if(clock)clock.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');document.getElementById('timer')?.classList.toggle('urgent',secs<=300);const notice=document.getElementById('timeNotice');if(notice&&secs<=300&&!notice.textContent)notice.textContent='Five minutes or less remain. Your exam will submit automatically when the timer reaches zero.';}
function runTimer(){clearInterval(interval);tick();if(!state.done)interval=setInterval(tick,250);}
function finish(timeout){if(!state||state.done)return;state.done=true;state.timedOut=!!timeout||remaining()===0;state.finished=Date.now();save();clearInterval(interval);if(dialog.open)dialog.close();results();window.scrollTo(0,0);}
function gradeFeedback(score){const percent=score/questions.length*100;if(score===questions.length)return {icon:'',title:'Perfect score! Congratulations!',message:'You answered every question correctly. Celebrate your achievement!'};if(percent>=80)return {icon:'',title:'Excellent performance!',message:'You are doing very well. Review your missed questions and aim for 100%.'};if(percent>=70)return {icon:'',title:'Good work!',message:'You have a strong foundation. Review the explanations and practise again.'};if(percent>=50)return {icon:'',title:'Keep building your confidence!',message:'Review your incorrect answers, work through the explanations and try again.'};return {icon:'',title:'Every attempt is a chance to improve.',message:'Take your time with the explanations. Practise each calculation and return for another attempt.'};}
function clearCelebration(){clearTimeout(celebrationTimeout);document.getElementById('celebration')?.remove();}

function retry(){if(!state||!state.done)return;clearCelebration();clearInterval(interval);const name=state.name;const attempt=(Number.isInteger(state.attempt)?state.attempt:1)+1;state=null;intro();document.getElementById('studentName').value=name;const form=document.getElementById('startForm');form.onsubmit=e=>{e.preventDefault();start();if(state){state.attempt=attempt;save();}};window.scrollTo(0,0);document.getElementById('studentName').focus();}
function results(){const score=questions.reduce((sum,q,i)=>sum+(state.answers[i]===q.answer?1:0),0);const feedback=gradeFeedback(score);const answered=state.answers.filter(a=>a!==null).length;const mins=Math.min(60,Math.max(0,Math.ceil(((state.finished||state.deadline)-state.started)/60000)));app.innerHTML=`<section class="resulthead"><div><div class="eyebrow">Exam complete · Attempt ${state.attempt||1}</div><h1 style="font-size:34px;margin:12px 0">${esc(state.name)}, here are your results.</h1><p class="muted">${state.timedOut?'Time expired. Your saved responses were submitted automatically.':'Your exam has been submitted.'}</p><div class="grade-message">${feedback.title}</div><p class="muted">${feedback.message}</p><p class="muted">${answered} answered · ${25-answered} unanswered · ${mins} minutes used</p></div><div><div class="score">${score}<span style="font-size:24px;color:#bfcce4"> / 25</span></div><strong>${(score/25*100).toFixed(1)}%</strong></div></section><div class="notice">Your result is saved on this browser only. Print or save it as a PDF to share it with your tutor. For information about tutoring, contact us at <a href="tel:18765692703">18765692703</a>.</div><div class="result-buttons"><button class="btn" id="retry">Try again</button><button class="btn secondary printbutton" id="print">Print results / Save as PDF</button></div><p class="note">You can attempt this quiz as many times as you like. Each new attempt starts with 60 minutes and cleared answers. The same 25 questions are used. Save your result before starting again.</p><h2 style="margin-top:32px">Answer key and explanations</h2><p class="muted">Review each scenario, your response and the correct answer.</p>${questions.map((q,i)=>{const a=state.answers[i],right=a===q.answer;return `<article class="review"><span class="tag">Question ${i+1}</span><span class="${right?'correct':'wrong'}" style="float:right;font-weight:700">${right?'Correct':'0 marks'}</span><div class="scenario"><p>${esc(q.scenario)}</p></div>${q.visual}<h3>${esc(q.prompt)}</h3><p class="${right?'correct':'wrong'}"><strong>Your answer:</strong> ${a===null?'Not answered':String.fromCharCode(65+a)+'. '+esc(q.options[a])}</p><p class="correct"><strong>Correct answer:</strong> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</p><p><strong>Explanation:</strong> ${esc(q.explanation)}</p></article>`;}).join('')}<p class="note">This is an original NLTS practice exam based on the supplied sample questions, not an official university examination.</p>`;document.getElementById('print').onclick=()=>window.print();document.getElementById('retry').onclick=retry;clearCelebration();}
document.getElementById('cancelSubmit').onclick=()=>dialog.close();document.getElementById('confirmSubmit').onclick=()=>finish(false);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});window.addEventListener('pageshow',tick);window.addEventListener('beforeunload',e=>{if(state&&!state.done){e.preventDefault();e.returnValue='';}});
// The exam never uses browser history to move between questions.
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const s=JSON.parse(e.newValue);if(valid(s)){state=s;if(state.done){clearInterval(interval);if(dialog.open)dialog.close();results();}else{renderQuestion();runTimer();}}}catch(err){}}});
if(state){if(state.done)results();else{renderQuestion();runTimer();}}else intro();
</script></body></html>
